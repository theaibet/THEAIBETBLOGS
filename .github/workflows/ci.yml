name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  build:
    # Every publication must build — a change may not fix one brand and break another.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [aflreviews, ufcreview, puntersreview, sportinformation, punterstory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build (${{ matrix.site }})
        run: npx next build
        env:
          SITE: ${{ matrix.site }}
